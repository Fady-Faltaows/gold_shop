<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Shop — {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-warning">
        <div class="container">
            <a class="navbar-brand text-dark fw-bold" href="{% url 'dashboard' %}">🥇 Gold Shop</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-dark" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="nav-link text-dark" href="{% url 'product_list' %}">Products</a>
                <a class="nav-link text-dark" href="{% url 'inventory_list' %}">Inventory</a>
                <a class="nav-link text-dark" href="{% url 'sale_list' %}">Sales</a>
                <a class="nav-link text-dark" href="{% url 'sale_create' %}">New Sale</a>
                <a class="nav-link text-dark" href="{% url 'purchase_list' %}">Purchases</a>
                <a class="nav-link text-dark" href="{% url 'reports_home' %}">Reports</a>
                <a class="nav-link text-dark" href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
