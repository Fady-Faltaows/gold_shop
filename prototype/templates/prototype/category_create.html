{% extends 'prototype/base.html' %}
{% block title %}Define Category — Gold Vault{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 style="margin: 0;">➕ Define New Category</h2>
    <a href="{% url 'category_list' %}" class="stitch-btn stitch-btn-secondary">← Back to Gallery</a>
</div>

<div class="stitch-card" style="border-color: var(--stitch-primary); max-width: 800px;">
    <div class="stitch-card-header">Category Specifications</div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        
        <div class="d-flex gap-4 mb-4" style="flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px;">
                <label class="stitch-label">Category Nomenclature</label>
                {{ form.name }}
            </div>
            <div style="flex: 1; min-width: 250px;">
                <label class="stitch-label">Visual Asset (Image Documentation)</label>
                <div class="custom-file-upload" style="background: var(--stitch-surface-container); border: 1px dashed var(--stitch-outline); border-radius: var(--stitch-radius); padding: 6px 12px;">
                    {{ form.image }}
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label class="stitch-label">Design & Collection Description</label>
            {{ form.description }}
        </div>

        <div class="mt-4">
            <button type="submit" class="stitch-btn stitch-btn-primary" style="padding: 14px 48px;">
                💾 Register Category — Expand Collection
            </button>
        </div>
    </form>
</div>

<style>
    /* Styling Django Form Widgets for Light Mode */
    input[type="text"], select, textarea {
        width: 100%;
        background: var(--stitch-surface-container);
        border: 1px solid var(--stitch-outline);
        border-radius: var(--stitch-radius);
        color: var(--stitch-on-surface);
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
        transition: all 0.3s;
    }
    input:focus, select:focus, textarea:focus {
        border-color: var(--stitch-primary);
        background: #FFF;
        box-shadow: 0 0 0 3px rgba(179, 142, 16, 0.1);
    }
    textarea {
        height: 120px;
    }
    .custom-file-upload input[type="file"] {
        font-size: 11px;
        color: var(--stitch-on-surface-variant);
        border: none;
        background: transparent;
        padding: 4px 0;
    }
</style>
{% endblock %}
