{% extends 'prototype/base.html' %}
{% block title %}Categories{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h2>🗂️ Categories</h2>
    <a href="{% url 'category_create' %}" class="btn btn-warning">+ New Category</a>
</div>

<div class="row g-3">
    {% for cat in categories %}
    <div class="col-md-4">
        <div class="card h-100">
            {% if cat.image %}
                <img src="{{ cat.image.url }}" class="card-img-top"
                     style="height:150px; object-fit:cover;">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ cat.name }}</h5>
                <p class="text-muted">{{ cat.description }}</p>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted">No categories yet.</p>
    {% endfor %}
</div>
{% endblock %}
