{% extends 'prototype/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white fw-bold">{{ title }}</div>
    <div class="card-body">
        <p class="mb-4">Are you sure you want to remove <strong>{{ object_name }}</strong>?</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Remove</button>
            <a href="{% url cancel_url %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
