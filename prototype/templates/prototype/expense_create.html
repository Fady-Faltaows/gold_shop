{% extends 'prototype/base.html' %}
{% block title %}New Expense{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h2>New Expense</h2>
    <a href="{% url 'expense_list' %}" class="btn btn-secondary">Back</a>
</div>

<div class="card border-warning">
    <div class="card-header bg-warning text-dark fw-bold">Expense Details</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Branch</label>
                    {{ form.branch }}
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Category</label>
                    {{ form.category }}
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Paid At</label>
                    {{ form.paid_at }}
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-bold">Description</label>
                    {{ form.description }}
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Amount</label>
                    {{ form.amount }}
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-bold">Notes</label>
                    {{ form.notes }}
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-warning fw-bold px-4">Save Expense</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
