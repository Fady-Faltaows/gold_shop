{% extends 'prototype/base.html' %}
{% block title %}New Purchase{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h2>📥 New Purchase</h2>
    <a href="{% url 'purchase_list' %}" class="btn btn-secondary">← Back</a>
</div>

<div class="card border-warning">
    <div class="card-header bg-warning text-dark fw-bold">Purchase Details</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">
                        Product
                        <a href="{% url 'product_create' %}" 
                        class="btn btn-sm btn-outline-warning ms-2"
                        target="_blank">
                            + New Product
                        </a>
                    </label>
                    {{ form.product }}
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Quantity</label>
                    {{ form.quantity_purchased }}
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Cost per Piece</label>
                    {{ form.cost_per_piece }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Supplier Name</label>
                    {{ form.supplier_name }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Notes</label>
                    {{ form.notes }}
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-warning fw-bold px-4">
                    💾 Save Purchase
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
